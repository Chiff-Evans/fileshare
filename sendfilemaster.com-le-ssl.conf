<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName sendfilemaster.com
    ServerAlias www.sendfilemaster.com

    DocumentRoot /var/www/html/fileshare

    <Directory /var/www/html/fileshare>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # PHP-FPM handling (adjust PHP version if different)
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/sendfilemaster_error.log
    CustomLog ${APACHE_LOG_DIR}/sendfilemaster_access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/www.sendfilemaster.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/www.sendfilemaster.com/privkey.pem
</VirtualHost>
</IfModule>