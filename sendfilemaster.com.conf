<VirtualHost *:80>
    ServerName sendfilemaster.com
    ServerAlias www.sendfilemaster.com

    DocumentRoot /var/www/html/fileshare
    <Directory /var/www/html/fileshare>

        Options -Indexes
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [QSA,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/sendfilemaster_error.log
    CustomLog ${APACHE_LOG_DIR}/sendfilemaster_access.log combined

    RewriteEngine On
    RewriteCond %{SERVER_NAME} =www.sendfilemaster.com [OR]
    RewriteCond %{SERVER_NAME} =sendfilemaster.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>